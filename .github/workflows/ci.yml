# CI — das einzige Netz vor Produktion.
#
# WARUM dieser Workflow: Push auf `main` löst bei Vercel ein SOFORTIGES
# Production-Deployment aus (s. docs/betrieb.md §2 — kein Preview-Zwischenschritt,
# kein manuelles Gate). Bisher lief vor "live" nur `next build` lokal auf dem
# Rechner des jeweiligen Entwicklers — nichts prüfte automatisch, ob Lint,
# Types oder die Bewertungs-Engine noch grün sind, bevor ein Push scharf geht.
# Diese vier Prüfungen bilden das nach, was vor jedem Merge eigentlich
# passieren müsste:
#   1. Lint      — Code-Stil/offensichtliche Fehler (eslint).
#   2. Typecheck — `tsc --noEmit`, deckt kaputte Importe/Typen ab, die ein
#                   Build durch Next.js' lascheren Transpile-Modus manchmal
#                   durchlässt.
#   3. Bewertungs-Battery — scripts/valuation-battery.mts läuft komplett
#                   offline (keine Netzwerk-/Secret-Abhängigkeit) und ist der
#                   Regressionsschutz für die Bewertungs-/Marktengine
#                   (src/lib/valuation.ts) — s. CLAUDE.md.
#   4. Zugangs-Matrix — scripts/intern-access-check.mts. Die /intern-Regel hat
#                   binnen zwei Tagen zweimal echte Menschen ausgesperrt
#                   (Sissy 19.08., Alex 20.08.); das Skript prüft die Fälle
#                   „wer kommt rein, wer nicht" offline durch.
#   5. Build     — `next build`. Läuft nachweislich auch OHNE gesetzte Env-
#                   Vars durch (alle Integrationen sind fail-soft: OnOffice
#                   fällt auf Mock-Daten zurück, Resend/Supabase bleiben
#                   inaktiv statt zu crashen) — hier also bewusst KEINE
#                   Secrets im Workflow nötig.
name: Prüfungen

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruefungen:
    name: Lint, Typecheck, Bewertungs-Battery, Zugangs-Matrix, Build
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Bewertungs-Battery (Regressionsschutz Engine)
        run: npx tsx scripts/valuation-battery.mts

      - name: Zugangs-Matrix /intern (Regressionsschutz Aussperrung)
        run: npx tsx scripts/intern-access-check.mts

      - name: Build
        run: npm run build
